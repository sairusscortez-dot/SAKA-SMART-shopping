<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAKA-SMART Marketplace</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="bar">
  <div class="logo">🌱 SAKA-SMART</div>
  <form class="search" id="sf" role="search"><input id="q" type="search" placeholder="Search fresh products…" aria-label="Search products"><button type="submit">Search</button></form>
  <button class="cartbtn" id="ordersOpen">📦 My orders</button>
  <button class="cartbtn" id="cartOpen" aria-label="Open cart">🛒 Cart<span class="badge" id="cnt">0</span></button>
</div></header>

<main>
  <section class="hero"><div><h1>Fresh from the farm to your door</h1><p>Buy directly from local farmers. Add to cart or buy now.</p></div><div class="big">🧺</div></section>
  <div class="chips" id="chips" role="group" aria-label="Categories"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="ov"></div>
<aside class="drawer" id="drawer" aria-label="Shopping cart">
  <div class="dh"><strong>My cart</strong><button class="x" id="cartClose">Close</button></div>
  <div class="dl" id="dl"></div>
  <div class="df"><div class="total"><span>Total</span><span id="dt">₱0.00</span></div><button class="btn fill" id="toCheckout">Checkout</button></div>
</aside>

<div class="overlay" id="ov2"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="script.js"></script>
</body>
</html>
